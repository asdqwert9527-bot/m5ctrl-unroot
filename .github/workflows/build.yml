name: Build M5Ctrl

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Build APK
        run: |
          WORK_DIR=$PWD
          ANDROID_HOME=$WORK_DIR/android-sdk
          BUILD_DIR=$WORK_DIR/build
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          mkdir -p $BUILD_DIR

          rm -rf $WORK_DIR/src $WORK_DIR/res $WORK_DIR/AndroidManifest.xml $WORK_DIR/libs
          mkdir -p $WORK_DIR/src/com/m5ctrl $WORK_DIR/res/values $WORK_DIR/libs

          # 官方三件套依赖 api + aidl + provider
          for a in api aidl provider; do
            wget -q -O $WORK_DIR/libs/shizuku-$a.aar \
              https://repo1.maven.org/maven2/dev/rikka/shizuku/$a/13.1.5/$a-13.1.5.aar
            unzip -p $WORK_DIR/libs/shizuku-$a.aar classes.jar > $WORK_DIR/libs/shizuku-$a.jar
          done
          ls -lh $WORK_DIR/libs/

          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.m5ctrl"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />
              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
              </queries>
              <application
                  android:label="@string/app_name"
                  android:allowBackup="false">
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="com.m5ctrl.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > $WORK_DIR/AndroidManifest.xml

          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">M5Ctrl</string>
          </resources>' > $WORK_DIR/res/values/strings.xml

          echo 'package com.m5ctrl;

          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.os.PowerManager;
          import android.util.Log;
          import android.view.Display;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          import rikka.shizuku.Shizuku;
          import rikka.shizuku.ShizukuBinderWrapper;
          import rikka.shizuku.SystemServiceHelper;

          public class MainActivity extends Activity implements View.OnClickListener,
                  Shizuku.OnBinderReceivedListener,
                  Shizuku.OnBinderDeadListener,
                  Shizuku.OnRequestPermissionResultListener {

              private static final String TAG = "M5Ctrl";
              private static final int REQ_PERM = 1001;
              private TextView mLog;
              private boolean mBinderReady = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 32, 32, 32);
                  sv.addView(root);

                  Button bDisp = new Button(this);
                  bDisp.setText("1. 列出当前屏幕");
                  bDisp.setTag("disp");
                  bDisp.setOnClickListener(this);

                  Button bOff = new Button(this);
                  bOff.setText("2. 关闭内屏（保留外屏）");
                  bOff.setTag("off");
                  bOff.setOnClickListener(this);

                  Button bOn = new Button(this);
                  bOn.setText("3. 恢复内屏");
                  bOn.setTag("on");
                  bOn.setOnClickListener(this);

                  Button bSleep = new Button(this);
                  bSleep.setText("4. 对照：整机休眠");
                  bSleep.setTag("sleep");
                  bSleep.setOnClickListener(this);

                  root.addView(bDisp);
                  root.addView(bOff);
                  root.addView(bOn);
                  root.addView(bSleep);

                  mLog = new TextView(this);
                  mLog.setTextSize(11);
                  mLog.setText("init...\n");
                  root.addView(mLog);
                  setContentView(sv);

                  Shizuku.addBinderReceivedListenerSticky(this);
                  Shizuku.addBinderDeadListener(this);
                  Shizuku.addRequestPermissionResultListener(this);
                  append("pingBinder=" + safePing());
              }

              @Override
              protected void onDestroy() {
                  Shizuku.removeBinderReceivedListener(this);
                  Shizuku.removeBinderDeadListener(this);
                  Shizuku.removeRequestPermissionResultListener(this);
                  super.onDestroy();
              }

              private boolean safePing() {
                  try {
                      return Shizuku.pingBinder();
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private void append(final String s) {
                  Log.i(TAG, s);
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          mLog.append(s + "\n");
                      }
                  });
              }

              @Override
              public void onBinderReceived() {
                  mBinderReady = true;
                  append("binder已连接 ver=" + safeVer());
                  requestPermIfNeeded();
              }

              @Override
              public void onBinderDead() {
                  mBinderReady = false;
                  append("binder已断开");
              }

              @Override
              public void onRequestPermissionResult(int requestCode, int grantResult) {
                  append(grantResult == PackageManager.PERMISSION_GRANTED ? "授权成功" : "授权被拒绝");
              }

              private int safeVer() {
                  try {
                      return Shizuku.getVersion();
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              private void requestPermIfNeeded() {
                  try {
                      if (Shizuku.isPreV11()) {
                          append("Shizuku版本过低(<11)");
                          return;
                      }
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          append("申请权限...");
                          Shizuku.requestPermission(REQ_PERM);
                      } else {
                          append("权限已授予");
                      }
                  } catch (Throwable t) {
                      append("权限异常: " + t);
                  }
              }

              private boolean ready() {
                  try {
                      return mBinderReady && Shizuku.pingBinder()
                              && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              @Override
              public void onClick(View v) {
                  String tag = (String) v.getTag();
                  if ("disp".equals(tag)) {
                      dumpDisplays();
                      return;
                  }
                  if (!ready()) {
                      append("Shizuku未就绪");
                      Toast.makeText(this, "Shizuku未就绪", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if ("off".equals(tag)) {
                      setPower(Display.STATE_OFF);
                  } else if ("on".equals(tag)) {
                      setPower(Display.STATE_ON);
                  } else if ("sleep".equals(tag)) {
                      goToSleep();
                  }
              }

              private void dumpDisplays() {
                  try {
                      DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      Display[] ds = dm.getDisplays();
                      append("---- 屏幕 " + ds.length + " 个 ----");
                      for (Display d : ds) {
                          append("id=" + d.getDisplayId() + " name=" + d.getName()
                                  + " state=" + stateName(d.getState())
                                  + " flags=0x" + Integer.toHexString(d.getFlags()));
                      }
                  } catch (Throwable t) {
                      append("列出屏幕失败: " + t);
                  }
              }

              private String stateName(int s) {
                  if (s == Display.STATE_OFF) return "OFF";
                  if (s == Display.STATE_ON) return "ON";
                  if (s == Display.STATE_DOZE) return "DOZE";
                  if (s == Display.STATE_DOZE_SUSPEND) return "DOZE_SUSPEND";
                  if (s == Display.STATE_ON_SUSPEND) return "ON_SUSPEND";
                  if (s == Display.STATE_VR) return "VR";
                  return "?" + s;
              }

              private long internalPhysicalId() {
                  try {
                      DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      Display d = dm.getDisplay(Display.DEFAULT_DISPLAY);
                      Method m = Display.class.getMethod("getPhysicalDisplayId");
                      Object r = m.invoke(d);
                      return r == null ? -1L : ((Long) r).longValue();
                  } catch (Throwable t) {
                      append("getPhysicalDisplayId 失败: " + t);
                      return -1L;
                  }
              }

              private IBinder physicalToken(long id) {
                  try {
                      Class<?> sc = Class.forName("android.view.SurfaceControl");
                      Method m = sc.getMethod("getPhysicalDisplayToken", long.class);
                      return (IBinder) m.invoke(null, Long.valueOf(id));
                  } catch (Throwable t) {
                      append("getPhysicalDisplayToken 失败: " + t);
                      return null;
                  }
              }

              private void setPower(int mode) {
                  long pid = internalPhysicalId();
                  append("内屏 physicalId=" + pid);
                  IBinder token = physicalToken(pid);
                  if (token == null) {
                      append("拿不到 displayToken，无法继续");
                      return;
                  }
                  append("token=" + token);
                  try {
                      Class<?> sc = Class.forName("android.view.SurfaceControl");
                      Method m = sc.getMethod("setDisplayPowerMode", IBinder.class, int.class);
                      m.invoke(null, token, Integer.valueOf(mode));
                      append("方案1(本进程) 成功 mode=" + mode);
                      Toast.makeText(this, "方案1已执行", Toast.LENGTH_SHORT).show();
                      return;
                  } catch (Throwable t) {
                      append("方案1(本进程) 失败: " + t);
                  }
                  try {
                      Integer code = SystemServiceHelper.getTransactionCode(
                              "android.ui.ISurfaceComposer", "setDisplayPowerMode");
                      append("setDisplayPowerMode 事务号=" + code);
                      IBinder sf = SystemServiceHelper.getSystemService("SurfaceFlinger");
                      if (sf == null || code == null || code.intValue() < 0) {
                          append("SurfaceFlinger 不可用，终止");
                          return;
                      }
                      IBinder wrapped = new ShizukuBinderWrapper(sf);
                      Parcel data = Parcel.obtain();
                      Parcel reply = Parcel.obtain();
                      data.writeInterfaceToken("android.ui.ISurfaceComposer");
                      data.writeStrongBinder(token);
                      data.writeInt(mode);
                      boolean ok = wrapped.transact(code.intValue(), data, reply, 0);
                      reply.readException();
                      data.recycle();
                      reply.recycle();
                      append("方案2(Shizuku转发) 返回=" + ok + " mode=" + mode);
                      Toast.makeText(this, "方案2已执行", Toast.LENGTH_SHORT).show();
                  } catch (Throwable t) {
                      append("方案2(Shizuku转发) 失败: " + t);
                      Toast.makeText(this, "两种方式都失败，见日志", Toast.LENGTH_LONG).show();
                  }
              }

              private void goToSleep() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      Method m = pm.getClass().getMethod("goToSleep", long.class);
                      m.setAccessible(true);
                      m.invoke(pm, Long.valueOf(0L));
                      append("goToSleep 已执行");
                  } catch (Throwable t) {
                      append("goToSleep 失败: " + t);
                      Toast.makeText(this, "goToSleep失败", Toast.LENGTH_SHORT).show();
                  }
              }
          }' > $WORK_DIR/src/com/m5ctrl/MainActivity.java

          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q -O $WORK_DIR/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q $WORK_DIR/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes 2>/dev/null | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" "build-tools;34.0.0"

          AJ=$ANDROID_HOME/platforms/android-33/android.jar

          echo "=== aapt 打包 ==="
          $BUILD_TOOLS/aapt package -f \
            -M $WORK_DIR/AndroidManifest.xml \
            -S $WORK_DIR/res \
            -I $AJ \
            -F $BUILD_DIR/base.apk

          echo "=== javac 编译 ==="
          mkdir -p $BUILD_DIR/classes
          javac -source 1.8 -target 1.8 \
            -bootclasspath $AJ \
            -classpath "$WORK_DIR/libs/shizuku-api.jar:$WORK_DIR/libs/shizuku-aidl.jar:$WORK_DIR/libs/shizuku-provider.jar" \
            -d $BUILD_DIR/classes \
            $WORK_DIR/src/com/m5ctrl/*.java

          echo "=== d8 脱糖（关键：不加 --no-desugaring）==="
          mkdir -p $BUILD_DIR/dex
          $BUILD_TOOLS/d8 --output $BUILD_DIR/dex \
            --min-api 24 \
            --lib $AJ \
            $BUILD_DIR/classes/com/m5ctrl/*.class \
            $WORK_DIR/libs/shizuku-api.jar \
            $WORK_DIR/libs/shizuku-aidl.jar \
            $WORK_DIR/libs/shizuku-provider.jar

          echo "=== 组装 APK ==="
          cd $BUILD_DIR
          zip -j base.apk dex/classes.dex
          cd $WORK_DIR

          echo "=== 签名 ==="
          keytool -genkey -keystore $WORK_DIR/test.keystore -alias test \
            -keyalg RSA -keysize 2048 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=test" -noprompt 2>/dev/null

          $BUILD_TOOLS/apksigner sign \
            --ks $WORK_DIR/test.keystore \
            --ks-key-alias test \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out $WORK_DIR/m5ctrl-unroot.apk \
            $BUILD_DIR/base.apk

          ls -lh $WORK_DIR/m5ctrl-unroot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m5ctrl-apk
          path: m5ctrl-unroot.apk
