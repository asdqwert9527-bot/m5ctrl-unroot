name: Build M5Ctrl

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Build APK
        run: |
          WORK_DIR=$PWD
          ANDROID_HOME=$WORK_DIR/android-sdk
          BUILD_DIR=$WORK_DIR/build
          BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.2
          mkdir -p $BUILD_DIR

          # 重建所有文件，规避异常字符
          rm -rf $WORK_DIR/res $WORK_DIR/src $WORK_DIR/AndroidManifest.xml
          mkdir -p $WORK_DIR/res/layout $WORK_DIR/res/xml $WORK_DIR/res/values
          mkdir -p $WORK_DIR/src/com/m5ctrl

          # AndroidManifest.xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.m5ctrl"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/ic_menu_info_details"
                  android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".M5AccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility" />
                  </service>
              </application>
          </manifest>' > $WORK_DIR/AndroidManifest.xml

          # 布局
          echo '<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">
              <Button android:id="@+id/btn_screen_off"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="关闭手机屏幕" />
              <Button android:id="@+id/btn_screen_on"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="点亮手机屏幕" />
          </LinearLayout>' > $WORK_DIR/res/layout/main.xml

          # 无障碍配置
          echo '<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/app_name"
              android:packageNames="*" />' > $WORK_DIR/res/xml/accessibility.xml

          # 字符串
          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">M5Ctrl</string>
          </resources>' > $WORK_DIR/res/values/strings.xml

          # MainActivity.java
          echo 'package com.m5ctrl;
          import android.app.Activity;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.util.Log;
          import android.widget.Button;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          public class MainActivity extends Activity {
              private boolean mScreenOffState = false;
              private DisplayManager.DisplayListener mDisplayListener;
              private static final int POWER_MODE_OFF = 0;
              private static final int POWER_MODE_NORMAL = 2;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.main);
                  Button btnOff = findViewById(R.id.btn_screen_off);
                  Button btnOn = findViewById(R.id.btn_screen_on);
                  btnOff.setOnClickListener(v -> setDisplayPowerMode(POWER_MODE_OFF));
                  btnOn.setOnClickListener(v -> setDisplayPowerMode(POWER_MODE_NORMAL));
                  mDisplayListener = new DisplayManager.DisplayListener() {
                      @Override public void onDisplayAdded(int displayId) {}
                      @Override public void onDisplayRemoved(int displayId) {
                          if (displayId == 20 && mScreenOffState) {
                              runOnUiThread(() -> {
                                  setDisplayPowerMode(POWER_MODE_NORMAL);
                                  Toast.makeText(MainActivity.this, "眼镜拔出，屏幕已恢复", Toast.LENGTH_SHORT).show();
                              });
                          }
                      }
                      @Override public void onDisplayChanged(int displayId) {}
                  };
                  DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  dm.registerDisplayListener(mDisplayListener, null);
              }
              private IBinder getShizukuBinder() {
                  try {
                      Class<?> clz = Class.forName("rikka.shizuku.Shizuku");
                      Method method = clz.getMethod("getBinder");
                      return (IBinder) method.invoke(null);
                  } catch (Exception e) { return null; }
              }
              private void setDisplayPowerMode(int mode) {
                  IBinder binder = getShizukuBinder();
                  if (binder == null) {
                      Toast.makeText(this, "请先开启 Shizuku", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      Class<?> stubClz = Class.forName("android.hardware.display.IDisplayManager$Stub");
                      Method asInterface = stubClz.getMethod("asInterface", IBinder.class);
                      Object dm = asInterface.invoke(null, binder);
                      Method setMode = dm.getClass().getMethod("setDisplayPowerMode", int.class, int.class);
                      setMode.invoke(dm, 0, mode);
                      mScreenOffState = (mode == POWER_MODE_OFF);
                      String msg = mode == POWER_MODE_OFF ? "手机屏幕已关闭" : "手机屏幕已点亮";
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Log.e("M5Ctrl", "操作失败", e);
                      Toast.makeText(this, "失败：" + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }' > $WORK_DIR/src/com/m5ctrl/MainActivity.java

          # 无障碍服务
          echo 'package com.m5ctrl;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          public class M5AccessibilityService extends AccessibilityService {
              @Override public void onAccessibilityEvent(AccessibilityEvent event) {}
              @Override public void onInterrupt() {}
          }' > $WORK_DIR/src/com/m5ctrl/M5AccessibilityService.java

          # 安装 SDK
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q -O $WORK_DIR/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q $WORK_DIR/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

          # 编译资源 + 生成 R.java
          mkdir -p $BUILD_DIR/res $BUILD_DIR/gen
          $BUILD_TOOLS/aapt2 compile -o $BUILD_DIR/res/layout.flat $WORK_DIR/res/layout/main.xml
          $BUILD_TOOLS/aapt2 compile -o $BUILD_DIR/res/xml.flat $WORK_DIR/res/xml/accessibility.xml
          $BUILD_TOOLS/aapt2 compile -o $BUILD_DIR/res/values.flat $WORK_DIR/res/values/strings.xml

          $BUILD_TOOLS/aapt2 link \
            -o $BUILD_DIR/base.apk \
            -I $ANDROID_HOME/platforms/android-33/android.jar \
            --manifest $WORK_DIR/AndroidManifest.xml \
            --java $BUILD_DIR/gen \
            --auto-add-overlay \
            $BUILD_DIR/res/layout.flat $BUILD_DIR/res/xml.flat $BUILD_DIR/res/values.flat

          # 编译 Java
          mkdir -p $BUILD_DIR/classes
          javac -source 1.8 -target 1.8 \
            -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar \
            -d $BUILD_DIR/classes \
            $WORK_DIR/src/com/m5ctrl/*.java \
            $BUILD_DIR/gen/com/m5ctrl/R.java

          # 生成 DEX
          $BUILD_TOOLS/d8 --output $BUILD_DIR/dex \
            --lib $ANDROID_HOME/platforms/android-33/android.jar \
            $BUILD_DIR/classes/com/m5ctrl/*.class

          # 组装 APK
          cd $BUILD_DIR
          zip -j base.apk dex/classes.dex
          cd $WORK_DIR

          # 签名
          keytool -genkey -keystore $WORK_DIR/test.keystore -alias test \
            -keyalg RSA -keysize 2048 -storepass 123456 -keypass 123456 \
            -dname "CN=test" -noprompt
          $BUILD_TOOLS/apksigner sign \
            --ks $WORK_DIR/test.keystore --ks-key-alias test \
            --ks-pass pass:123456 --key-pass pass:123456 \
            --out $WORK_DIR/m5ctrl-unroot.apk $BUILD_DIR/base.apk

          echo "编译完成：m5ctrl-unroot.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m5ctrl-apk
          path: m5ctrl-unroot.apk
