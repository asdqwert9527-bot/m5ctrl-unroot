name: Build M5Ctrl

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Build APK
        run: |
          WORK_DIR=$PWD
          ANDROID_HOME=$WORK_DIR/android-sdk
          BUILD_DIR=$WORK_DIR/build
          BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.2
          mkdir -p $BUILD_DIR

          # 清理原有文件，全部重新生成
          rm -rf $WORK_DIR/res $WORK_DIR/src $WORK_DIR/AndroidManifest.xml
          mkdir -p $WORK_DIR/src/com/m5ctrl

          # 1. 生成 AndroidManifest.xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.m5ctrl"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <application
                  android:label="M5Ctrl"
                  android:icon="@android:drawable/ic_menu_info_details"
                  android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > $WORK_DIR/AndroidManifest.xml

          # 2. 生成 MainActivity.java（全匿名内部类，无Lambda）
          echo 'package com.m5ctrl;
          import android.app.Activity;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.util.Log;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import java.lang.reflect.Method;
          public class MainActivity extends Activity {
              private boolean mScreenOffState = false;
              private DisplayManager.DisplayListener mDisplayListener;
              private static final int POWER_MODE_OFF = 0;
              private static final int POWER_MODE_NORMAL = 2;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(48, 48, 48, 48);

                  Button btnOff = new Button(this);
                  btnOff.setText("关闭手机屏幕");
                  btnOff.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          setDisplayPowerMode(POWER_MODE_OFF);
                      }
                  });

                  Button btnOn = new Button(this);
                  btnOn.setText("点亮手机屏幕");
                  btnOn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          setDisplayPowerMode(POWER_MODE_NORMAL);
                      }
                  });

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT);
                  layout.addView(btnOff, lp);
                  lp.topMargin = 36;
                  layout.addView(btnOn, lp);
                  setContentView(layout);

                  initDisplayListener();
              }

              private void initDisplayListener() {
                  mDisplayListener = new DisplayManager.DisplayListener() {
                      @Override public void onDisplayAdded(int displayId) {}
                      @Override public void onDisplayRemoved(int displayId) {
                          if (displayId == 20 && mScreenOffState) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      setDisplayPowerMode(POWER_MODE_NORMAL);
                                      Toast.makeText(MainActivity.this, "眼镜拔出，屏幕已恢复", Toast.LENGTH_SHORT).show();
                                  }
                              });
                          }
                      }
                      @Override public void onDisplayChanged(int displayId) {}
                  };
                  DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                  dm.registerDisplayListener(mDisplayListener, null);
              }

              private IBinder getShizukuBinder() {
                  try {
                      Class<?> clz = Class.forName("rikka.shizuku.Shizuku");
                      Method method = clz.getMethod("getBinder");
                      return (IBinder) method.invoke(null);
                  } catch (Exception e) { return null; }
              }

              private void setDisplayPowerMode(int mode) {
                  IBinder binder = getShizukuBinder();
                  if (binder == null) {
                      Toast.makeText(this, "请先开启 Shizuku", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      Class<?> stubClz = Class.forName("android.hardware.display.IDisplayManager$Stub");
                      Method asInterface = stubClz.getMethod("asInterface", IBinder.class);
                      Object dm = asInterface.invoke(null, binder);
                      Method setMode = dm.getClass().getMethod("setDisplayPowerMode", int.class, int.class);
                      setMode.invoke(dm, 0, mode);
                      mScreenOffState = (mode == POWER_MODE_OFF);
                      String msg = mode == POWER_MODE_OFF ? "手机屏幕已关闭" : "手机屏幕已点亮";
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Log.e("M5Ctrl", "操作失败", e);
                      Toast.makeText(this, "失败：" + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }' > $WORK_DIR/src/com/m5ctrl/MainActivity.java

          # 3. 安装 Android SDK 工具
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q -O $WORK_DIR/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q $WORK_DIR/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" "build-tools;33.0.2"

          # 4. 打包清单（无自定义资源）
          echo "打包基础APK..."
          $BUILD_TOOLS/aapt package -f \
            -M $WORK_DIR/AndroidManifest.xml \
            -I $ANDROID_HOME/platforms/android-33/android.jar \
            -F $BUILD_DIR/base.apk

          # 5. 编译 Java 代码
          echo "编译Java代码..."
          mkdir -p $BUILD_DIR/classes
          javac -source 1.7 -target 1.7 \
            -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar \
            -d $BUILD_DIR/classes \
            $WORK_DIR/src/com/m5ctrl/*.java

          # 6. 生成 DEX
          echo "生成DEX..."
          $BUILD_TOOLS/d8 --output $BUILD_DIR/dex \
            --lib $ANDROID_HOME/platforms/android-33/android.jar \
            $BUILD_DIR/classes/com/m5ctrl/*.class

          # 7. 组装 APK
          echo "组装APK..."
          cd $BUILD_DIR
          zip -j base.apk dex/classes.dex
          cd $WORK_DIR

          # 8. 签名
          echo "签名APK..."
          keytool -genkey -keystore $WORK_DIR/test.keystore -alias test \
            -keyalg RSA -keysize 2048 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=test" -noprompt

          $BUILD_TOOLS/apksigner sign \
            --ks $WORK_DIR/test.keystore \
            --ks-key-alias test \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out $WORK_DIR/m5ctrl-unroot.apk \
            $BUILD_DIR/base.apk

          echo "编译完成：m5ctrl-unroot.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m5ctrl-apk
          path: m5ctrl-unroot.apk
