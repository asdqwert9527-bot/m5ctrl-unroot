name: Build M5Ctrl

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl openjdk-17-jdk

      - name: Build APK
        run: |
          WORK_DIR=$PWD
          ANDROID_HOME=$WORK_DIR/android-sdk
          BUILD_DIR=$WORK_DIR/build
          BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.2
          mkdir -p $BUILD_DIR

          # 重建资源文件，规避文件名异常
          rm -rf $WORK_DIR/res
          mkdir -p $WORK_DIR/res/layout $WORK_DIR/res/xml $WORK_DIR/res/values

          echo '<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">
              <Button
                  android:id="@+id/btn_screen_off"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="关闭手机屏幕" />
              <Button
                  android:id="@+id/btn_screen_on"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="点亮手机屏幕" />
          </LinearLayout>' > $WORK_DIR/res/layout/main.xml

          echo '<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/app_name"
              android:packageNames="*" />' > $WORK_DIR/res/xml/accessibility.xml

          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">M5Ctrl</string>
          </resources>' > $WORK_DIR/res/values/strings.xml

          # 下载 Shizuku 依赖
          mkdir -p $WORK_DIR/lib
          curl -sL -o $WORK_DIR/lib/shizuku-api.jar \
            https://repo1.maven.org/maven2/dev/rikka/shizuku/api/13.1.2/api-13.1.2.jar

          # 安装 Android SDK 工具
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL -o $WORK_DIR/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q $WORK_DIR/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" "build-tools;33.0.2"

          # 打包资源
          $BUILD_TOOLS/aapt package -f \
            -M $WORK_DIR/AndroidManifest.xml \
            -S $WORK_DIR/res \
            -I $ANDROID_HOME/platforms/android-33/android.jar \
            -F $BUILD_DIR/base.apk

          # 编译 Java 代码
          mkdir -p $BUILD_DIR/classes
          javac -source 1.8 -target 1.8 \
            -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar \
            -cp $WORK_DIR/lib/shizuku-api.jar \
            -d $BUILD_DIR/classes \
            $WORK_DIR/src/com/m5ctrl/*.java

          # 生成 DEX
          $BUILD_TOOLS/d8 --output $BUILD_DIR/dex \
            --lib $ANDROID_HOME/platforms/android-33/android.jar \
            $BUILD_DIR/classes/com/m5ctrl/*.class

          # 组装 APK
          cd $BUILD_DIR
          zip -j base.apk dex/classes.dex
          cd $WORK_DIR

          # 签名
          keytool -genkey -keystore $WORK_DIR/test.keystore -alias test \
            -keyalg RSA -keysize 2048 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=test" -noprompt

          $BUILD_TOOLS/apksigner sign \
            --ks $WORK_DIR/test.keystore \
            --ks-key-alias test \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out $WORK_DIR/m5ctrl-unroot.apk \
            $BUILD_DIR/base.apk

          echo "编译完成"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m5ctrl-apk
          path: m5ctrl-unroot.apk
