name: Build M5Ctrl

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Build APK
        run: |
          WORK_DIR=$PWD
          ANDROID_HOME=$WORK_DIR/android-sdk
          BUILD_DIR=$WORK_DIR/build
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          mkdir -p $BUILD_DIR

          rm -rf $WORK_DIR/res $WORK_DIR/src $WORK_DIR/AndroidManifest.xml $WORK_DIR/libs
          mkdir -p $WORK_DIR/src/com/m5ctrl $WORK_DIR/libs

          # 下载官方完整依赖
          wget -q -O $WORK_DIR/libs/shizuku-api.aar \
            https://repo1.maven.org/maven2/dev/rikka/shizuku/api/13.1.5/api-13.1.5.aar
          wget -q -O $WORK_DIR/libs/shizuku-provider.aar \
            https://repo1.maven.org/maven2/dev/rikka/shizuku/provider/13.1.5/provider-13.1.5.aar
          
          unzip -p $WORK_DIR/libs/shizuku-api.aar classes.jar > $WORK_DIR/libs/shizuku-api.jar
          unzip -p $WORK_DIR/libs/shizuku-provider.aar classes.jar > $WORK_DIR/libs/shizuku-provider.jar

          # 1. 官方规范清单：必须注册 ShizukuProvider
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.m5ctrl"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <queries>
                  <package android:name="rikka.shizuku" />
              </queries>
              <application
                  android:label="M5Ctrl"
                  android:icon="@android:drawable/ic_menu_info_details"
                  android:allowBackup="false">
                  
                  <!-- Shizuku 官方要求：必须注册 Provider 才能连接服务 -->
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="com.m5ctrl.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > $WORK_DIR/AndroidManifest.xml

          # 2. 遵循官方规范的 MainActivity
          echo 'package com.m5ctrl;
          import android.app.Activity;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.util.Log;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import rikka.shizuku.Shizuku;
          import rikka.shizuku.ShizukuBinderWrapper;

          public class MainActivity extends Activity
              implements View.OnClickListener, DisplayManager.DisplayListener, Runnable,
                         Shizuku.OnBinderReceivedListener, Shizuku.OnBinderDeadListener,
                         Shizuku.OnRequestPermissionResultListener {

              private static final int TASK_RESTORE_SCREEN = 1;
              private int mCurrentTask = 0;
              private boolean mScreenOffState = false;
              private static final int POWER_MODE_OFF = 0;
              private static final int POWER_MODE_NORMAL = 2;
              private static final int REQUEST_CODE = 1001;
              private Integer mSetDisplayPowerModeCode = null;
              private IBinder mDisplayBinder = null;
              private String mInitError = "";
              private boolean mShizukuReady = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(48, 48, 48, 48);

                  Button btnOff = new Button(this);
                  btnOff.setText("关闭手机屏幕");
                  btnOff.setOnClickListener(this);

                  Button btnOn = new Button(this);
                  btnOn.setText("点亮手机屏幕");
                  btnOn.setOnClickListener(this);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT);
                  layout.addView(btnOff, lp);
                  lp.topMargin = 36;
                  layout.addView(btnOn, lp);
                  setContentView(layout);

                  // 注册显示监听
                  try {
                      DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      dm.registerDisplayListener(this, null);
                  } catch (Throwable e) {
                      Log.e("M5Ctrl", "注册监听失败", e);
                  }

                  // 初始化系统服务
                  initDisplayService();

                  // 官方规范：注册 Shizuku 生命周期监听
                  Shizuku.addBinderReceivedListener(this);
                  Shizuku.addBinderDeadListener(this);
                  Shizuku.addRequestPermissionResultListener(this);

                  // 启动时检查一次 Binder 状态
                  checkBinderState();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  Shizuku.removeBinderReceivedListener(this);
                  Shizuku.removeBinderDeadListener(this);
                  Shizuku.removeRequestPermissionResultListener(this);
              }

              // ===== Shizuku 官方生命周期回调 =====
              @Override
              public void onBinderReceived() {
                  mShizukuReady = true;
                  Toast.makeText(this, "Shizuku 已连接", Toast.LENGTH_SHORT).show();
                  checkAndRequestPermission();
              }

              @Override
              public void onBinderDead() {
                  mShizukuReady = false;
                  Toast.makeText(this, "Shizuku 连接已断开", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onRequestPermissionResult(int requestCode, int grantResult) {
                  if (requestCode == REQUEST_CODE) {
                      if (grantResult == 0) {
                          Toast.makeText(this, "Shizuku 授权成功", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "Shizuku 授权被拒绝", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void checkBinderState() {
                  try {
                      if (Shizuku.pingBinder()) {
                          mShizukuReady = true;
                          checkAndRequestPermission();
                      } else {
                          Toast.makeText(this, "未检测到 Shizuku 服务，请先启动 Shizuku", Toast.LENGTH_LONG).show();
                      }
                  } catch (Throwable e) {
                      Toast.makeText(this, "未检测到 Shizuku 服务", Toast.LENGTH_LONG).show();
                      Log.e("M5Ctrl", "检测失败", e);
                  }
              }

              private void checkAndRequestPermission() {
                  try {
                      if (Shizuku.isPreV11()) {
                          Toast.makeText(this, "Shizuku 版本过低，需 v11+", Toast.LENGTH_LONG).show();
                          return;
                      }
                      if (Shizuku.checkSelfPermission() != 0) {
                          Shizuku.requestPermission(REQUEST_CODE);
                      }
                  } catch (Throwable e) {
                      Log.e("M5Ctrl", "权限检查失败", e);
                  }
              }

              private void initDisplayService() {
                  try {
                      Class<?> smClz = Class.forName("android.os.ServiceManager");
                      Method getService = smClz.getMethod("getService", String.class);
                      mDisplayBinder = (IBinder) getService.invoke(null, "display");

                      Class<?> stubClz = Class.forName("android.hardware.display.IDisplayManager$Stub");
                      Field field = stubClz.getDeclaredField("TRANSACTION_setDisplayPowerMode");
                      field.setAccessible(true);
                      mSetDisplayPowerModeCode = field.getInt(null);
                  } catch (Throwable e) {
                      mInitError = "服务初始化失败: " + e.getMessage();
                      Log.e("M5Ctrl", "初始化服务失败", e);
                  }
              }

              @Override
              public void onClick(View v) {
                  try {
                      if (!mShizukuReady) {
                          Toast.makeText(this, "Shizuku 未连接", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      if (Shizuku.checkSelfPermission() != 0) {
                          Toast.makeText(this, "请先在 Shizuku 中授权", Toast.LENGTH_SHORT).show();
                          Shizuku.requestPermission(REQUEST_CODE);
                          return;
                      }
                      if (mDisplayBinder == null || mSetDisplayPowerModeCode == null) {
                          Toast.makeText(this, mInitError, Toast.LENGTH_LONG).show();
                          return;
                      }
                      CharSequence text = ((Button)v).getText();
                      if ("关闭手机屏幕".equals(text)) {
                          setDisplayPowerMode(0, POWER_MODE_OFF);
                      } else {
                          setDisplayPowerMode(0, POWER_MODE_NORMAL);
                      }
                  } catch (Throwable e) {
                      Toast.makeText(this, "点击出错: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      Log.e("M5Ctrl", "点击失败", e);
                  }
              }

              @Override
              public void onDisplayAdded(int displayId) {}

              @Override
              public void onDisplayRemoved(int displayId) {
                  try {
                      if (displayId == 20 && mScreenOffState) {
                          mCurrentTask = TASK_RESTORE_SCREEN;
                          runOnUiThread(this);
                      }
                  } catch (Throwable e) {
                      Log.e("M5Ctrl", "拔屏回调失败", e);
                  }
              }

              @Override
              public void onDisplayChanged(int displayId) {}

              @Override
              public void run() {
                  try {
                      if (mCurrentTask == TASK_RESTORE_SCREEN) {
                          setDisplayPowerMode(0, POWER_MODE_NORMAL);
                          Toast.makeText(MainActivity.this, "眼镜拔出，屏幕已恢复", Toast.LENGTH_SHORT).show();
                      }
                  } catch (Throwable e) {
                      Log.e("M5Ctrl", "回调执行失败", e);
                  }
              }

              private void setDisplayPowerMode(int displayId, int mode) {
                  try {
                      Parcel data = Parcel.obtain();
                      Parcel reply = Parcel.obtain();
                      data.writeInterfaceToken("android.hardware.display.IDisplayManager");
                      data.writeInt(displayId);
                      data.writeInt(mode);
                      
                      IBinder wrappedBinder = new ShizukuBinderWrapper(mDisplayBinder);
                      boolean result = wrappedBinder.transact(mSetDisplayPowerModeCode, data, reply, 0);
                      
                      reply.recycle();
                      data.recycle();

                      if (result) {
                          mScreenOffState = (mode == POWER_MODE_OFF);
                          String msg = mode == POWER_MODE_OFF ? "手机屏幕已关闭" : "手机屏幕已点亮";
                          Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "调用失败，系统返回失败", Toast.LENGTH_LONG).show();
                      }
                  } catch (Throwable e) {
                      Log.e("M5Ctrl", "执行失败", e);
                      Toast.makeText(this, "执行失败: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }' > $WORK_DIR/src/com/m5ctrl/MainActivity.java

          # 3. 安装 Android SDK
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q -O $WORK_DIR/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q $WORK_DIR/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          yes 2>/dev/null | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-33" "build-tools;34.0.0"

          # 4. 打包清单
          echo "=== 打包基础APK ==="
          $BUILD_TOOLS/aapt package -f \
            -M $WORK_DIR/AndroidManifest.xml \
            -I $ANDROID_HOME/platforms/android-33/android.jar \
            -F $BUILD_DIR/base.apk

          # 5. 编译Java
          echo "=== 编译Java代码 ==="
          mkdir -p $BUILD_DIR/classes
          javac -source 1.8 -target 1.8 \
            -XDstringConcat=inline \
            -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar \
            -classpath "$WORK_DIR/libs/shizuku-api.jar:$WORK_DIR/libs/shizuku-provider.jar" \
            -d $BUILD_DIR/classes \
            $WORK_DIR/src/com/m5ctrl/*.java

          # 6. 生成DEX
          echo "=== 生成DEX ==="
          mkdir -p $BUILD_DIR/dex
          $BUILD_TOOLS/d8 --output $BUILD_DIR/dex \
            --min-api 24 \
            --no-desugaring \
            --lib $ANDROID_HOME/platforms/android-33/android.jar \
            $BUILD_DIR/classes/com/m5ctrl/*.class \
            $WORK_DIR/libs/shizuku-api.jar \
            $WORK_DIR/libs/shizuku-provider.jar

          # 7. 组装APK
          echo "=== 组装APK ==="
          cd $BUILD_DIR
          zip -j base.apk dex/classes.dex
          cd $WORK_DIR

          # 8. 签名
          echo "=== 签名APK ==="
          keytool -genkey -keystore $WORK_DIR/test.keystore -alias test \
            -keyalg RSA -keysize 2048 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=test" -noprompt 2>/dev/null

          $BUILD_TOOLS/apksigner sign \
            --ks $WORK_DIR/test.keystore \
            --ks-key-alias test \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out $WORK_DIR/m5ctrl-unroot.apk \
            $BUILD_DIR/base.apk

          echo "=== 编译完成 ==="
          ls -lh $WORK_DIR/m5ctrl-unroot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m5ctrl-apk
          path: m5ctrl-unroot.apk
