name: Build M5Ctrl APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Android SDK
        run: |
          mkdir -p ~/android/cmdline-tools
          cd ~/android
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools
          export ANDROID_HOME=$HOME/android
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV

      - name: Install SDK components
        run: |
          export ANDROID_HOME=$HOME/android
          yes | $ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Build
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: m5ctrl-v2.4-apk
          path: m5ctrl_unroot.apk
          retention-days: 90
